services:
  - type: web
    name: beamal-art-studio-api
    runtime: node
    plan: starter
    branch: test
    autoDeploy: false
    buildCommand: npm ci --prefix sample && npm run build --prefix sample
    startCommand: npm run api --prefix sample
    healthCheckPath: /api/health
    disk:
      name: beamal-private-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: BEAMAL_HOST
        value: 0.0.0.0
      - key: BEAMAL_PORT
        value: "10000"
      - key: BEAMAL_SECURE_COOKIES
        value: "true"
      - key: BEAMAL_DATA_DIR
        value: /var/data
      - key: BEAMAL_DATABASE_PATH
        value: /var/data/beamal.sqlite
      - key: DATABASE_URL
        sync: false
      - key: BEAMAL_ALLOWED_ORIGINS
        sync: false